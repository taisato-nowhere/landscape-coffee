name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # microCMS で記事を公開/更新したときに自動再ビルド（Webリクエストで起動）
  repository_dispatch:
    types: [microcms-publish]

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つに（途中キャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        env:
          # microCMS の鍵（リポジトリ Settings → Secrets に登録）。未設定ならモック表示。
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
